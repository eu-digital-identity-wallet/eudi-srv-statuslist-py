# SonarCloud static analysis (SAST) with test coverage for app/.
# Runs on every push (except Dependabot branches), pull request and manual dispatch.
# Pull requests run on pull_request_target, so forks get the secrets: the job checks
# out and tests the target branch, never the pull request's code.
# Pushes to main in eu-digital-identity-wallet also send the report to DefectDojo.
# Needs secrets: SONAR_TOKEN, DOJO_TOKEN and DOJO_URL.
name: SAST - SonarCloud
on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request_target:
  workflow_dispatch:

# Read-only token.
permissions:
  contents: read
  pull-requests: read

jobs:
  check_secret:
    name: Check secret presence
    runs-on: ubuntu-latest
    steps:
      - name: Fail if SONAR_TOKEN is missing
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN secret is not set: create the SonarCloud project ${PROJECT_KEY} and add the secret"
            exit 1
          fi
          echo "Secret exists. The workflow will be continued"

  analysis:
    name: SAST - SonarCloud analysis
    needs: check_secret
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests and generate coverage.xml
        run: |
          env $(grep -v '^#' .env.test | xargs) pytest --cov=app --cov-config=pyproject.toml --cov-report=xml:coverage.xml
          coverage report
      - name: setup projectkey
        run: echo "PROJECTKEY=${{ github.repository_owner}}_$(echo ${{ github.repository }} | sed 's/.*\///')" >> "$GITHUB_ENV"
      - name: SonarCloud Scan - Push/WD analysis
        if: (github.event_name == 'push'|| github.event_name == 'workflow_dispatch')
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
            args: >
                -Dsonar.organization=${{ github.repository_owner }}
                -Dsonar.projectKey=${{ env.PROJECTKEY }}
                -Dsonar.sources=app
                -Dsonar.python.coverage.reportPaths=coverage.xml
      - name: SonarCloud Scan - PR analysis
        if: (github.event_name == 'pull_request_target')
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
            args: >
                -Dsonar.organization=${{ github.repository_owner }}
                -Dsonar.projectKey=${{ env.PROJECTKEY }}
                -Dsonar.sources=app
                -Dsonar.python.coverage.reportPaths=coverage.xml
                -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
                -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}
                -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        if: (github.repository_owner == 'eu-digital-identity-wallet' && github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Send report to DefectDojo
        if: (github.repository_owner == 'eu-digital-identity-wallet' && github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
        env:
          DOJO_TOKEN: ${{ secrets.DOJO_TOKEN }}
          DOJO_URL: ${{ secrets.DOJO_URL }}
          REPOSITORY: ${{ github.repository }}
          ORGANIZATION: ${{ github.repository_owner }}
        run: |
          npm install -g sonar-report@3.0.10
          sonar-report \
            --sonarurl="https://sonarcloud.io" \
            --sonarorganization="$ORGANIZATION" \
            --branch=main \
            --sonartoken="$SONAR_TOKEN" \
            --output sonarreport.html \
            --application="$PROJECTKEY" \
            --sonarcomponent="$PROJECTKEY"
          curl -fsS -X POST "$DOJO_URL/api/v2/reimport-scan/" \
            -H "Authorization: Token $DOJO_TOKEN" \
            -F "active=true" \
            -F "scan_type=SonarQube Scan detailed" \
            -F "minimum_severity=Info" \
            -F "skip_duplicates=true" \
            -F "close_old_findings=true" \
            -F "file=@sonarreport.html" \
            -F "scan_date=$(TZ='EET' date '+%Y-%m-%d')" \
            -F "auto_create_context=True" \
            -F "product_name=$REPOSITORY-main" \
            -F "engagement_name=Static Application Security Testing - $REPOSITORY-main"
